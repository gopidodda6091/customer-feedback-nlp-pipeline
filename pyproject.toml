[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feedback-nlp"
version = "0.1.0"
description = "Batch NLP enrichment of synthetic Bluebonnet Software feedback with MLflow evaluation"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [{ name = "Gopi Dodda" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["spark: needs a JVM and PySpark (skipped when Java is missing)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
